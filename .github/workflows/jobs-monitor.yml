name: Live Government Jobs Monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the hourly live refresh so both workflows never push main at once.
concurrency:
  group: govt-jobs-data
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run official-source monitor
        run: python scripts/update_jobs.py

      - name: Commit fresh verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json data/monitor-health.json
          if git diff --cached --quiet; then
            echo "No verification changes."
            exit 0
          fi
          git commit -m "chore: refresh live government job verification"
          git push origin HEAD:main
