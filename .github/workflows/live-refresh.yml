name: Live Govt Jobs Refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize all workflows that write refreshed job data to main.
concurrency:
  group: govt-jobs-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh official sources
        run: python3 scripts/update_live.py

      - name: Commit refreshed feed
        run: |
          git config user.name "Govt Jobs Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          if git diff --cached --quiet; then
            echo "No live feed changes."
            exit 0
          fi
          git commit -m "chore: refresh live government job sources"
          git push origin HEAD:main
