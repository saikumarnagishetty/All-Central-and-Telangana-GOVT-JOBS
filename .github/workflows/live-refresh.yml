name: Live Govt Jobs Refresh

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: live-jobs
  cancel-in-progress: true

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh official sources
        run: python3 scripts/update_live.py

      - name: Commit refreshed feed
        run: |
          git config user.name "Govt Jobs Hub Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add live.json
          git diff --cached --quiet || git commit -m "chore: refresh live government job sources"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
